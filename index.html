<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>911 Restoration — Collections Command Center</title>
<meta name="robots" content="noindex,nofollow">
<!-- This page replaces the old unauthenticated Command Center that used to be
     served here. The real application now lives behind Google sign-in at the
     Worker URL below. Anyone arriving on an old bookmark or an old email link
     is sent there instead of being handed an ungated copy of the app.
     Do NOT restore the previous index.html to this path. -->
<meta http-equiv="refresh" content="0; url=https://911-collections-copilot.911rcollection.workers.dev/">
<link rel="canonical" href="https://911-collections-copilot.911rcollection.workers.dev/">
<style>
  :root { color-scheme: dark; }
  body { margin:0; background:#0f1023; color:#e8e9f0;
         font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:72px 16px; }
  h1 { font-size:1.4rem; margin:0 0 12px; }
  a.btn { display:inline-block; background:#4a7cff; color:#fff; padding:10px 18px;
          border-radius:8px; text-decoration:none; font-weight:600; margin-top:8px; }
  p { color:#c9cbdd; }
</style>
</head>
<body>
<main>
  <h1>The Collections Command Center has moved</h1>
  <p>It now requires signing in with your Google account. You should be redirected
     automatically — if nothing happens, use the button below.</p>
  <p><a class="btn" href="https://911-collections-copilot.911rcollection.workers.dev/">Open the Command Center</a></p>
</main>
<script>
  // Belt and braces: the meta refresh covers scripting-disabled browsers,
  // this covers the rest without leaving the old URL in session history.
  location.replace("https://911-collections-copilot.911rcollection.workers.dev/");
</script>
</body>
</html>
